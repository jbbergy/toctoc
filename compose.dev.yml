# Développement local complet : PostgreSQL + application (docker compose -f compose.dev.yml up)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: toctoc
      POSTGRES_PASSWORD: toctoc
      POSTGRES_DB: toctoc
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toctoc']
      interval: 2s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgres://toctoc:toctoc@db:5432/toctoc
      PORT: 3000
      CLIENT_DIST: /app/dist
    ports:
      - '3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
